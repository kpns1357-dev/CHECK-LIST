<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Math Poster Checklist</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

</head>

<body>

<div class="app">

<!-- ================= HEADER ================= -->

<header>

<div class="logo">

<span class="material-icons">shopping_cart</span>

<div>
<h1>Math Poster Checklist</h1>
<p>Everything you need for your competition</p>
</div>

</div>

<div class="headerButtons">

<button id="themeBtn" class="iconBtn">
<span class="material-icons">dark_mode</span>
</button>

<button id="resetBtn" class="iconBtn">
<span class="material-icons">restart_alt</span>
</button>

</div>

</header>

<!-- ================= SEARCH ================= -->

<section class="searchSection">

<div class="searchBox">

<span class="material-icons">search</span>

<input
type="text"
id="searchInput"
placeholder="Search materials...">

</div>

</section>

<!-- ================= FILTERS ================= -->

<section class="filters">

<button class="filter active" data-filter="all">

All

</button>

<button class="filter" data-filter="materials">

Poster Materials

</button>

<button class="filter" data-filter="colors">

Colors

</button>

<button class="filter" data-filter="custom">

Custom

</button>

</section>

<!-- ================= PROGRESS ================= -->

<section class="progressCard">

<div class="progressHeader">

<h3>Your Progress</h3>

<span id="progressText">
0%
</span>

</div>

<div class="progressBar">

<div id="progressFill"></div>

</div>

<p id="progressDescription">

0 of 0 materials collected

</p>

</section>

<!-- ================= ACTIONS ================= -->

<section class="actions">

<button id="selectAll">

<span class="material-icons">done_all</span>

Select All

</button>

<button id="clearAll">

<span class="material-icons">remove_done</span>

Clear All

</button>

<button id="exportBtn">

<span class="material-icons">download</span>

Export

</button>

</section>

<!-- ================= LIST ================= -->

<section id="listContainer">

<!-- Generated by JavaScript -->

</section>

<!-- ================= CUSTOM ITEM ================= -->

<section class="customCard">

<h2>

<span class="material-icons">

playlist_add

</span>

Add Custom Material

</h2>

<div class="customInput">

<input
type="text"
id="customInput"
placeholder="Example: Glue Stick">

<button id="addBtn">

<span class="material-icons">

add

</span>

Add

</button>

</div>

</section>

<!-- ================= FOOTER ================= -->

<footer>

Made with ❤️ for Math Poster Competition

</footer>

</div>

<script src="app.js"></script>

</body>

</html>
