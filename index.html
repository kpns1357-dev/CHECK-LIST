<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Poster Materials Checklist</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#eef3ff;
    padding:30px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    border-radius:15px;
    padding:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#2c3e50;
    margin-bottom:10px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.progressBox{
    margin-bottom:25px;
}

.progress{
    width:100%;
    height:24px;
    background:#ddd;
    border-radius:20px;
    overflow:hidden;
}

.bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#00c853,#64dd17);
    transition:.4s;
}

#percent{
    margin-top:8px;
    font-weight:bold;
    text-align:center;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
    gap:20px;
}

.card{
    border:2px solid #ddd;
    border-radius:12px;
    padding:18px;
}

.card h2{
    margin-bottom:15px;
    color:#1565c0;
}

label{
    display:block;
    margin:10px 0;
    cursor:pointer;
    font-size:17px;
}

input[type=checkbox]{
    transform:scale(1.2);
    margin-right:10px;
}

.addBox{
    margin-top:25px;
    display:flex;
    gap:10px;
}

.addBox input{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

.addBtn{
    background:#1976d2;
    color:white;
}

.resetBtn{
    background:#e53935;
    color:white;
    margin-top:20px;
}

.custom{
    margin-top:20px;
}

.custom h2{
    color:#8e24aa;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>📋 Math Poster Materials Checklist</h1>
<p class="subtitle">Tick the materials you already have.</p>

<div class="progressBox">
<div class="progress">
<div class="bar" id="bar"></div>
</div>
<div id="percent"></div>
</div>

<div class="grid">

<div class="card">
<h2>Poster Materials</h2>

<label><input type="checkbox">A3 Chart Paper</label>
<label><input type="checkbox">Pencil</label>
<label><input type="checkbox">Eraser</label>
<label><input type="checkbox">Ruler</label>
<label><input type="checkbox">Black Marker</label>
<label><input type="checkbox">12 Color Sketch Pens</label>
<label><input type="checkbox">Color Pencils / Crayons</label>
<label><input type="checkbox">Compass</label>
<label><input type="checkbox">White Gel Pen</label>

</div>

<div class="card">
<h2>Colors Needed</h2>

<label><input type="checkbox">Black</label>
<label><input type="checkbox">Dark Blue</label>
<label><input type="checkbox">Light Blue / Sky Blue</label>
<label><input type="checkbox">Purple</label>
<label><input type="checkbox">Pink</label>
<label><input type="checkbox">Red</label>
<label><input type="checkbox">Orange</label>
<label><input type="checkbox">Yellow</label>
<label><input type="checkbox">Green</label>
<label><input type="checkbox">Brown</label>
<label><input type="checkbox">Grey</label>

</div>

</div>

<div class="custom">

<h2>➕ Add Your Own Material</h2>

<div class="addBox">
<input id="newItem" placeholder="Example: Glitter Pen">
<button class="addBtn" onclick="addItem()">Add</button>
</div>

<div id="customList"></div>

</div>

<button class="resetBtn" onclick="resetAll()">Reset Checklist</button>

</div>

<script>

const customList=document.getElementById("customList");

function save(){
const states=[];
document.querySelectorAll("input[type=checkbox]").forEach(c=>{
states.push(c.checked);
});
localStorage.setItem("states",JSON.stringify(states));
localStorage.setItem("custom",customList.innerHTML);
update();
}

function load(){

if(localStorage.getItem("custom")){
customList.innerHTML=localStorage.getItem("custom");
}

const boxes=document.querySelectorAll("input[type=checkbox]");

const saved=JSON.parse(localStorage.getItem("states"));

if(saved){
boxes.forEach((b,i)=>{
b.checked=saved[i];
});
}

boxes.forEach(b=>{
b.onchange=save;
});

customList.querySelectorAll("input[type=checkbox]").forEach(b=>{
b.onchange=save;
});

update();
}

function addItem(){

const txt=document.getElementById("newItem").value.trim();

if(txt==="") return;

const label=document.createElement("label");

label.innerHTML='<input type="checkbox">'+txt;

customList.appendChild(label);

document.getElementById("newItem").value="";

label.querySelector("input").onchange=save;

save();

}

function update(){

const boxes=document.querySelectorAll("input[type=checkbox]");

let checked=0;

boxes.forEach(b=>{
if(b.checked) checked++;
});

const total=boxes.length;

const percent=Math.round(checked/total*100);

document.getElementById("bar").style.width=percent+"%";

document.getElementById("percent").innerHTML=
checked+" / "+total+" Materials Ready ("+percent+"%)";

}

function resetAll(){

if(confirm("Reset the checklist?")){

localStorage.clear();

location.reload();

}

}

window.onload=load;

</script>

</body>
</html>
